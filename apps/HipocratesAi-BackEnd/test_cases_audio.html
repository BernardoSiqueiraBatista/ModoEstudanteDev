<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Testar Áudio - Hipócrates Cases</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 10px 20px; border: none; border-radius: 4px; background: #007bff; color: white; cursor: pointer; font-size: 16px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.stop { background: #dc3545; }
    #log { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 4px; height: 300px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
    .status { font-weight: bold; padding: 5px; border-radius: 4px; display: inline-block; }
    .status.offline { background: #ffebee; color: #c62828; }
    .status.online { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎙️ Simulador de Áudio da Task 7 (OSCE)</h2>
    <p>Para testar, você precisa do <b>attempt_id</b> (gerado ao iniciar uma tentativa) e um <b>JWT Token</b> válido (pegue no seu frontend logado ou no Insomnia).</p>
    
    <label>Attempt ID:</label>
    <input type="text" id="attemptId" placeholder="ex: 573bbdc8-25ff-4d42-a461-694f5fcea5a9">
    
    <label>Token JWT (Bearer):</label>
    <input type="text" id="token" placeholder="eyJhbGciOiJIUzI1NiIsInR...">

    <p>
      Status: <span id="statusIndicator" class="status offline">Desconectado</span>
    </p>

    <button id="btnStart">🎤 Iniciar Microfone e Conectar</button>
    <button id="btnStop" class="stop" disabled>🛑 Parar</button>
  </div>

  <div class="card">
    <h3>Transcrições em Tempo Real:</h3>
    <div id="log"></div>
  </div>

  <script>
    let ws;
    let audioContext;
    let processor;
    let stream;

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const logDiv = document.getElementById('log');
    const statusIndicator = document.getElementById('statusIndicator');

    function log(msg, color = '#00ff00') {
      const p = document.createElement('div');
      p.style.color = color;
      p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(p);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    btnStart.onclick = async () => {
      const attemptId = document.getElementById('attemptId').value.trim();
      const token = document.getElementById('token').value.trim();

      if (!attemptId || !token) {
        alert('Preencha o Attempt ID e o Token JWT.');
        return;
      }

      try {
        // Pede permissão pro microfone
        log('Solicitando acesso ao microfone...', '#ffeb3b');
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // Conecta no WS com o token na URL
        const wsUrl = `ws://localhost:3333/ws/cases/attempts/${attemptId}/audio?token=${token}`;
        log(`Conectando em ${wsUrl}...`, '#ffeb3b');
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusIndicator.innerText = 'Online - Captando Áudio';
          statusIndicator.className = 'status online';
          log('✅ Conectado com sucesso!', '#4caf50');
          startStreaming(stream);
          btnStart.disabled = true;
          btnStop.disabled = false;
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.type === 'transcript_partial') {
            log(`[Parcial - ${data.speaker}]: ${data.text}`, '#9e9e9e');
          } else if (data.type === 'transcript_final') {
            log(`[Final - ${data.speaker}]: ${data.text}`, '#2196f3');
          }
        };

        ws.onclose = (e) => {
          log(`❌ Desconectado (Código: ${e.code})`, '#f44336');
          stopAll();
        };

        ws.onerror = (e) => {
          log('Erro no WebSocket.', '#f44336');
          console.error(e);
        };

      } catch (err) {
        log(`Erro de permissão do microfone: ${err.message}`, '#f44336');
      }
    };

    btnStop.onclick = () => stopAll();

    function startStreaming(audioStream) {
      // Cria o AudioContext cravado em 16000Hz (Exigência Linear16 da Deepgram)
      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      const source = audioContext.createMediaStreamSource(audioStream);
      
      // Node processador para capturar os buffers
      processor = audioContext.createScriptProcessor(4096, 1, 1);
      
      processor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        
        const inputData = e.inputBuffer.getChannelData(0);
        // Converte Float32Array para Int16Array (Linear16 PCM)
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        
        // Envia o áudio binário bruto pro backend
        ws.send(pcm16.buffer);
      };

      source.connect(processor);
      processor.connect(audioContext.destination);
      log('📡 Enviando pedaços de áudio em tempo real...', '#ffeb3b');
    }

    function stopAll() {
      if (ws) ws.close();
      if (processor) processor.disconnect();
      if (audioContext) audioContext.close();
      if (stream) stream.getTracks().forEach(t => t.stop());
      
      statusIndicator.innerText = 'Desconectado';
      statusIndicator.className = 'status offline';
      btnStart.disabled = false;
      btnStop.disabled = true;
      log('⏹️ Gravação parada.', '#ff9800');
    }
  </script>
</body>
</html>
